[package]
name = "ronicos"
version = "2.1.4"
description = "Ronic OS — local-first agent workstation"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ronicos_lib"
# rlib only: the MinGW linker rejects a cdylib once Rust's export ordinals pass 65535.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time"] }
qrcode = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.2"
regex = "1"
base64 = "0.22"
url = "2"
include_dir = "0.7"
portable-pty = "0.8"
ed25519-dalek = "2"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }
uiautomation = "0.16"

[profile.release]
lto = false
codegen-units = 16
